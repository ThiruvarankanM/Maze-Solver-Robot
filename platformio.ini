[platformio]
default_envs = mega

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; Runs the hardware-free tests on the laptop: pio test -e native
[env:native]
platform = native
