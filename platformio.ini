[platformio]
default_envs = mega

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; Main robot firmware.
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; Hardware-free unit tests, run on your laptop: pio test -e native
[env:native]
platform = native

; Maze simulator, runs on your laptop: pio run -e sim
[env:sim]
platform = native
build_src_filter = -<*> +<../sim/*.cpp>

; One env per hardware bring-up sketch in hardware_tests/.
[env:motor_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/motor_test.cpp>

[env:encoder_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/encoder_test.cpp>

[env:ultrasonic_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/ultrasonic_test.cpp>

[env:ir_array_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/ir_array_test.cpp>

[env:gyro_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/gyro_test.cpp>

[env:wall_follower_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/wall_follower_test.cpp>
