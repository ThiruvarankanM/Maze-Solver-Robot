[platformio]
default_envs = mega

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200

; Runs the hardware-free tests on the laptop: pio test -e native
[env:native]
platform = native

; Hardware test sketches: each builds one file from hardware_tests/ instead of src/
[env:motor_test]
extends = env:mega
build_src_filter = +<../hardware_tests/motor_test.cpp>

[env:encoder_test]
extends = env:mega
build_src_filter = +<../hardware_tests/encoder_test.cpp>

[env:ultrasonic_test]
extends = env:mega
build_src_filter = +<../hardware_tests/ultrasonic_test.cpp>

[env:ir_array_test]
extends = env:mega
build_src_filter = +<../hardware_tests/ir_array_test.cpp>

[env:gyro_test]
extends = env:mega
build_src_filter = +<../hardware_tests/gyro_test.cpp>
