[platformio]
default_envs = mega

[env]
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra

; ==========================================
; MAIN ROBOT FIRMWARE
; Arduino Mega 2560
; ==========================================
[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200


; ==========================================
; HARDWARE-FREE UNIT TESTS
; Run on your laptop
; Command: pio test -e native
; ==========================================
[env:native]
platform = native


; ==========================================
; MAZE SIMULATOR
; Runs on your laptop, not on the Arduino
; Command: pio run -e sim
; ==========================================
[env:sim]
platform = native
build_src_filter = -<*> +<../sim/*.cpp>


; ==========================================
; MOTOR DRIVER TEST
; Arduino Mega 2560
; ==========================================
[env:motor_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/motor_test.cpp>


; ==========================================
; ENCODER TEST
; Arduino Mega 2560
; ==========================================
[env:encoder_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/encoder_test.cpp>


; ==========================================
; ULTRASONIC SENSOR TEST
; Arduino Mega 2560
; ==========================================
[env:ultrasonic_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/ultrasonic_test.cpp>


; ==========================================
; IR SENSOR ARRAY TEST
; Arduino Mega 2560
; ==========================================
[env:ir_array_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/ir_array_test.cpp>


; ==========================================
; GYROSCOPE TEST
; Arduino Mega 2560
; ==========================================
[env:gyro_test]
extends = env:mega
build_src_filter = -<*> +<../hardware_tests/gyro_test.cpp>